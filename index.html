<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a585e8">
  <title>Marcelle's Animal Word Adventure</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #ffd6e7 0%, #c3f0ca 50%, #d6e8ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.6s;
    }

    /* ── Screens ── */
    .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 18px; text-align: center; position: relative; z-index: 1; }
    .screen.active { display: flex; }

    /* ── Title Screen ── */
    #title-screen h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; color: #5a3e8a; text-shadow: 2px 2px 0 #e0d0ff; }
    #title-screen p { font-size: clamp(1rem, 3vw, 1.4rem); color: #6b5b8a; }
    .title-animals { font-size: clamp(2.5rem, 8vw, 5rem); }
    .title-animals span { display: inline-block; animation: bounce 1.5s infinite; }
    .title-animals span:nth-child(2) { animation-delay: 0.15s; }
    .title-animals span:nth-child(3) { animation-delay: 0.30s; }
    .title-animals span:nth-child(4) { animation-delay: 0.45s; }
    .title-animals span:nth-child(5) { animation-delay: 0.60s; }
    .title-animals span:nth-child(6) { animation-delay: 0.75s; }

    /* ── Character Select ── */
    #char-screen h2 { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 900; color: #5a3e8a; }
    #char-screen p  { font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: #7a5a9a; }
    .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 580px; width: 100%; }
    .char-card {
      background: white; border: 4px solid #d0b8ff; border-radius: 24px;
      padding: 18px 8px; cursor: pointer; font-family: 'Nunito', sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 5px 0 #b89aee;
    }
    .char-card:hover { transform: translateY(-4px); box-shadow: 0 9px 0 #b89aee; }
    .char-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #b89aee; }
    .char-emoji { font-size: clamp(3rem, 10vw, 5rem); display: block; }
    .char-name { font-size: clamp(0.9rem, 2.5vw, 1.2rem); font-weight: 900; color: #5a3e8a; margin-top: 6px; }
    .char-dest { font-size: clamp(0.7rem, 2vw, 0.95rem); color: #9a7ab0; margin-top: 3px; }

    /* ── Map Screen ── */
    .map-header { font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 900; color: #5a3e8a; }
    .map-sub    { font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: #7a5a9a; }

    /* ── Map Canvas (parchment) ── */
    .map-canvas {
      position: relative; width: min(95vw, 520px); aspect-ratio: 5/4;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(160,110,50,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(150,100,40,0.20) 0%, transparent 50%),
        linear-gradient(135deg, #f7e6c4 0%, #f0d8a0 30%, #eac888 60%, #f0d8a0 100%);
      box-shadow: 0 0 0 2px #6B4210, 0 0 0 5px #c8a030, 0 0 0 7px #6B4210,
                  8px 8px 20px rgba(0,0,0,0.45), inset 0 0 50px rgba(80,40,5,0.2);
      clip-path: polygon(
        0.5% 1.2%, 9% 0.3%, 18% 1.8%, 27% 0.5%, 36% 2.0%, 45% 0.8%,
        55% 1.5%, 64% 0.2%, 73% 2.2%, 82% 0.7%, 91% 1.9%, 100% 0.4%,
        99.1% 9%, 98.0% 18%, 99.5% 27%, 97.8% 36%, 99.2% 45%,
        98.5% 55%, 99.8% 64%, 97.9% 73%, 99.3% 82%, 98.1% 91%, 99.6% 99.5%,
        91% 99.4%, 82% 98.0%, 73% 99.7%, 64% 97.9%, 55% 99.2%,
        45% 98.5%, 36% 99.8%, 27% 97.8%, 18% 99.3%, 9% 98.1%, 0% 99.5%,
        1.9% 91%, 0.6% 82%, 2.2% 73%, 1.0% 63%, 2.3% 54%,
        0.8% 45%, 2.1% 36%, 1.3% 27%, 2.0% 17%, 0.4% 8%
      );
      margin-bottom: 22px;
    }
    .map-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      overflow: visible; pointer-events: none;
    }
    .map-compass {
      position: absolute; bottom: 6px; right: 8px;
      font-size: clamp(1.5rem, 3.5vw, 2rem); opacity: 0.55; pointer-events: none;
    }

    /* ── Map Stamps ── */
    .map-stamp {
      position: absolute; transform: translate(-50%,-50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: default; background: none; border: none; box-shadow: none;
    }
    .stamp-icon {
      font-size: clamp(1.4rem, 3.5vw, 2rem); line-height: 1;
      filter: sepia(0.2) drop-shadow(1px 2px 3px rgba(60,30,0,0.45));
      transition: transform 0.2s;
    }
    .map-stamp.done .stamp-icon    { opacity:0.65; filter:sepia(0.6) drop-shadow(1px 2px 2px rgba(60,30,0,0.3)); }
    .map-stamp.current             { cursor: pointer; }
    .map-stamp.current .stamp-icon { filter: drop-shadow(0 0 6px rgba(200,40,40,0.7));
                                     animation: stampFloat 1.8s ease-in-out infinite; }
    .map-stamp.current:hover .stamp-icon { transform: scale(1.12); }
    .map-stamp.locked .stamp-icon  { opacity:0.28; filter: grayscale(0.85) sepia(0.4); }
    .map-stamp.home-stamp .stamp-icon { filter: drop-shadow(0 0 5px rgba(200,150,0,0.55)); }
    .stamp-label {
      font-size: clamp(0.42rem, 1.1vw, 0.58rem); font-weight:900; font-style:italic;
      color: #2a1008; white-space:nowrap; letter-spacing:0.5px;
      text-shadow: 0 0 5px rgba(245,220,160,0.95), 0 0 10px rgba(245,220,160,0.7);
    }

    /* ── Traveling Character ── */
    .map-char {
      position: absolute; font-size: clamp(1.5rem, 4vw, 2.2rem);
      transform: translate(-50%, -120%);
      transition: left 0.75s cubic-bezier(0.4,0,0.2,1), top 0.75s cubic-bezier(0.4,0,0.2,1);
      animation: mapBounce 1.2s ease-in-out infinite;
      z-index: 20; pointer-events: none;
      filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.35));
    }

    /* ── Encounter Screen ── */
    .enc-header {
      background: rgba(255,255,255,0.90); border-radius: 20px;
      padding: 12px 18px; max-width: 560px; width: 100%;
    }
    .enc-location { font-size: clamp(0.8rem, 2.2vw, 0.95rem); color: #9a7ab0; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .enc-problem  { font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 700; color: #5a3e8a; margin-top: 5px; }
    .scene-display {
      font-size: clamp(2.2rem, 8vw, 4.5rem); letter-spacing: 4px;
      background: rgba(255,255,255,0.82); border-radius: 20px;
      padding: 14px 20px; min-height: 84px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.35s; max-width: 560px; width: 100%;
    }
    .progress-bar { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; max-width: 380px; }
    .pdot {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.5); border: 3px solid #d0b8ff;
      font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .pdot.filled { background: #c8f7c5; border-color: #4caf50; }
    .enc-instruction {
      font-size: clamp(1.1rem, 3.5vw, 1.5rem); font-weight: 700; color: #5a3e8a;
      background: rgba(255,255,255,0.75); border-radius: 10px; padding: 4px 14px;
    }

    /* ── Speak Button ── */
    #btn-speak {
      font-size: clamp(2rem, 6vw, 3.5rem);
      background: linear-gradient(135deg, #7eb8ff, #5599ff);
      border: none; border-radius: 50%;
      width: clamp(68px, 14vw, 96px); height: clamp(68px, 14vw, 96px);
      cursor: pointer;
      box-shadow: 0 5px 0 #3366cc, 0 7px 15px rgba(85,153,255,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #btn-speak:active { transform: translateY(3px); box-shadow: 0 2px 0 #3366cc; }

    /* ── Word Buttons ── */
    .word-buttons { display: flex; flex-direction: column; gap: 13px; width: 100%; max-width: 400px; }
    .word-btn {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 900;
      color: #3a2860; background: rgba(255,255,255,0.95);
      border: 4px solid #d0b8ff; border-radius: 24px;
      padding: 15px 22px; cursor: pointer;
      box-shadow: 0 5px 0 #b89aee, 0 7px 20px rgba(100,50,200,0.15);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
      text-transform: lowercase;
    }
    .word-btn:hover  { background: #f5f0ff; transform: translateY(-2px); }
    .word-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b89aee; }
    .word-btn.correct { background: #c8f7c5; border-color: #4caf50; animation: correctFlash 0.6s ease; }
    .word-btn.wrong   { background: #ffd6d6; border-color: #f44336; animation: shake 0.5s ease; }

    /* ── Level Win Screen ── */
    .lwin-friend { font-size: clamp(5rem, 18vw, 9rem); animation: popIn 0.5s cubic-bezier(0.36,0.07,0.19,0.97); }
    #levelwin-msg { font-size: clamp(1.2rem, 3.8vw, 2rem); font-weight: 900; color: #5a3e8a; max-width: 500px; }
    .confetti-row { font-size: clamp(1.5rem, 5vw, 2.5rem); letter-spacing: 8px; }

    /* ── Win Screen ── */
    #win-screen h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; color: #5a3e8a; }
    #win-screen p  { font-size: clamp(1rem, 3vw, 1.3rem); color: #6b5b8a; max-width: 480px; }
    .win-big { font-size: clamp(5rem, 18vw, 10rem); animation: popIn 0.6s cubic-bezier(0.36,0.07,0.19,0.97); }
    .win-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    /* ── Shared Buttons ── */
    .btn-primary {
      font-family: 'Nunito', sans-serif; font-size: clamp(1.2rem, 3.5vw, 1.8rem); font-weight: 900;
      background: linear-gradient(135deg, #ff7eb3, #ff5599); color: white;
      border: none; border-radius: 50px; padding: 15px 38px; cursor: pointer;
      box-shadow: 0 6px 0 #cc3377, 0 8px 20px rgba(255,85,153,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc3377; }
    .btn-secondary {
      font-family: 'Nunito', sans-serif; font-size: clamp(1rem, 3vw, 1.5rem); font-weight: 900;
      background: linear-gradient(135deg, #7eb8ff, #5599ff); color: white;
      border: none; border-radius: 50px; padding: 13px 30px; cursor: pointer;
      box-shadow: 0 5px 0 #3366cc;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 #3366cc; }

    /* ── Start Over Button ── */
    .btn-startover {
      position: fixed; bottom: 16px; left: 16px; z-index: 50;
      font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700;
      background: rgba(255,255,255,0.75); color: #7a5a9a;
      border: 2px solid #c0a0e0; border-radius: 50px;
      padding: 7px 16px; cursor: pointer; backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .btn-startover:hover { background: rgba(255,255,255,0.95); }

    /* ── Star Badge ── */
    .star-badge { font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 700; color: #5a3e8a; background: rgba(255,255,255,0.85); border-radius: 50px; padding: 7px 18px; }
    .star-bounce { animation: starBounce 0.4s ease; }

    /* ── Animations ── */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-18px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.03); }
    }
    @keyframes stampFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes mapBounce {
      0%,100% { transform: translate(-50%,-120%); }
      50%      { transform: translate(-50%,-136%); }
    }
    @keyframes correctFlash {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.08); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-10px); }
      40%       { transform: translateX(10px); }
      60%       { transform: translateX(-8px); }
      80%       { transform: translateX(8px); }
    }
    @keyframes popIn {
      0%   { transform: scale(0.2); opacity: 0; }
      70%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes starBounce {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.4); }
    }

    /* ── Sentence Builder ── */
    #sentence-builder {
      display: none; flex-direction: column; align-items: center;
      gap: 12px; width: 100%; max-width: 560px;
    }
    #sentence-slots {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      padding: 14px 16px; min-height: 62px;
      background: rgba(255,255,255,0.88); border-radius: 20px; width: 100%;
    }
    .sent-slot {
      min-width: 52px; height: 50px;
      border: 3px dashed #c0a0f0; border-radius: 14px;
      background: rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(0.95rem, 3.2vw, 1.25rem); font-weight: 900;
      color: #3a2860; padding: 0 10px; transition: all 0.2s;
    }
    .sent-slot.filled { border-style: solid; border-color: #a080e0; background: #f0eaff; cursor: pointer; }
    .sent-slot.filled:hover { background: #e8e0ff; }
    .sent-slot.correct { background: #c8f7c5; border-color: #4caf50; border-style: solid; }
    .sent-slot.wrong   { background: #ffd6d6; border-color: #f44336; border-style: solid; animation: shake 0.5s ease; }
    #sentence-word-bank {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px;
    }
    .word-tile {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem); font-weight: 900;
      color: #3a2860; background: rgba(255,255,255,0.95);
      border: 3px solid #d0b8ff; border-radius: 16px;
      padding: 10px 16px; cursor: pointer;
      box-shadow: 0 4px 0 #b89aee;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
      user-select: none;
    }
    .word-tile:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 #b89aee; }
    .word-tile:active { transform: translateY(2px);  box-shadow: 0 2px 0 #b89aee; }
    .word-tile.used   { opacity: 0; pointer-events: none; }

    /* ── Picture Vocab (emoji shown, pick the word) ── */
    .word-btn .pic-emoji {
      display: block; font-size: clamp(2.5rem, 10vw, 4rem); line-height: 1.1;
    }
    .word-btn .pic-label { display: block; font-size: clamp(1.2rem, 4vw, 1.8rem); }

    /* ── Picture Match Mode (4 pictures ↔ 4 words) ── */
    #picture-match {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; width: 100%; max-width: 500px;
    }
    #pic-match-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%;
    }
    .pic-match-col {
      display: flex; flex-direction: column; gap: 10px;
    }
    .pic-card {
      font-size: clamp(2.5rem, 9vw, 4rem); text-align: center;
      background: rgba(255,255,255,0.92); border-radius: 18px;
      border: 4px solid #d0c0f0; padding: 10px;
      cursor: pointer; transition: all 0.2s; user-select: none;
      min-height: 70px; display: flex; align-items: center; justify-content: center;
    }
    .pic-card.word-card {
      font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 900;
      color: #3a2860; font-family: 'Nunito', sans-serif;
    }
    .pic-card.selected { border-color: #7c4dff; background: #ede7f6; box-shadow: 0 0 12px rgba(124,77,255,0.4); }
    .pic-card.matched  { border-color: #4caf50; background: #c8f7c5; opacity: 0.7; pointer-events: none; }
    .pic-card.wrong    { animation: shake 0.5s ease; border-color: #f44336; background: #ffd6d6; }

    /* ── Math Mode ── */
    #math-mode {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; width: 100%; max-width: 480px;
    }
    #math-display {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.92); border-radius: 20px;
      padding: 16px 24px; min-width: 200px;
    }
    .math-visual {
      font-size: clamp(1.4rem, 4vw, 2rem);
      line-height: 1.8; text-align: center; letter-spacing: 3px;
      flex-wrap: wrap; max-width: 280px;
    }
    .math-problem {
      font-family: 'Nunito', sans-serif; font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 900; color: #3a2860; text-align: center;
      max-width: 300px; word-break: break-word;
    }
    #math-answers {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }
    .math-btn {
      font-family: 'Nunito', sans-serif; font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 900; color: #3a2860;
      background: rgba(255,255,255,0.95); border: 3px solid #d0b8ff;
      border-radius: 18px; padding: 12px 22px; cursor: pointer;
      box-shadow: 0 4px 0 #b89aee; transition: transform 0.1s, box-shadow 0.1s;
      min-width: 80px; text-align: center;
    }
    .math-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 #b89aee; }
    .math-btn:active { transform: translateY(2px);  box-shadow: 0 2px 0 #b89aee; }
    .math-btn.correct { background: #c8f7c5; border-color: #4caf50; }
    .math-btn.wrong   { background: #ffd6d6; border-color: #f44336; animation: shake 0.5s ease; }

    /* ── Spanish translation reveal ── */
    #translation-hint {
      display: none; font-family: 'Nunito', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem); font-style: italic;
      color: #5a3d8a; background: rgba(255,255,255,0.88);
      border-radius: 14px; padding: 6px 20px; text-align: center;
    }

    @keyframes sway {
      0%,100% { transform: translateX(0); }
      33%      { transform: translateX(4px) translateY(-3px); }
      66%      { transform: translateX(-3px) translateY(1px); }
    }
    @keyframes floatAnim {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-10px) scale(1.05); }
    }
    @keyframes shimmer {
      0%,100% { filter: brightness(1); }
      50%      { filter: brightness(1.5); }
    }

    /* ── Mini-Game Screen ── */
    #minigame-screen { padding: 10px; gap: 10px; }
    .mg-title {
      font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 900;
      color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .mg-canvas-wrap {
      position: relative; width: min(95vw, calc(100vh - 250px), 600px); aspect-ratio: 1;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 6px 0 #7755aa, 0 8px 20px rgba(100,50,200,0.3);
      border: 4px solid #c0a0e0;
    }
    #mg-canvas { width: 100%; height: 100%; display: block; background: #111; }
    .mg-hud {
      display: flex; gap: 20px; justify-content: center;
      font-size: clamp(1rem, 3vw, 1.4rem); font-weight: 900; color: #5a3e8a;
    }
    .mg-hud-item {
      background: rgba(255,255,255,0.85); border-radius: 50px; padding: 6px 18px;
    }
    .mg-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; z-index: 10; background: rgba(0,0,0,0.65); border-radius: 16px;
    }
    .mg-overlay-icon { font-size: clamp(3rem, 10vw, 5rem); animation: popIn 0.5s ease; }
    .mg-overlay-title {
      font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 900;
      color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .mg-overlay-sub {
      font-size: clamp(0.9rem, 3vw, 1.2rem); font-weight: 700; color: #ffd700;
    }
    .mg-dpad {
      display: none; position: relative; width: 174px; height: 174px; margin-top: 4px;
      touch-action: none;
    }
    .mg-dpad-btn {
      position: absolute; width: 56px; height: 56px; border-radius: 14px;

  window.speechSynthesis.speak(u);
}

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i-1)], p1 = pts[i];
    const p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
    const cp1x = p1.x + (p2.x - p0.x)/6, cp1y = p1.y + (p2.y - p0.y)/6;
    const cp2x = p2.x - (p3.x - p1.x)/6, cp2y = p2.y - (p3.y - p1.y)/6;
    d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
  }
  return d;
}

// ════════════════════════════════════════════════
//  ENCOUNTER
// ════════════════════════════════════════════════
// Pick `count` sentences from `pool` that haven't been used yet (tracked by `usedSet`).
// Falls back to resetting the used set if the pool runs low.
function pickUnusedSentences(pool, usedSet, count) {
  let available = pool.map((s, i) => i).filter(i => !usedSet.has(i));
  if (available.length < count) {
    usedSet.clear();
    available = pool.map((_, i) => i);
  }
  const picked = shuffleArray(available).slice(0, count);
  picked.forEach(i => usedSet.add(i));
  return picked.map(i => pool[i]);
}

// ── Level type rotation (shuffled each journey) ──
let levelTypeOrder = []; // 9-element array: each is 'words','math','spanish'

function shuffleLevelTypes() {
  const types = ['words', 'math', 'spanish'];
  let result = [];
  // 3 groups of 3 — each group has one of each type, no back-to-back across groups
  for (let g = 0; g < 3; g++) {
    let group;
    let attempts = 0;
    do {
      group = shuffleArray([...types]);
      attempts++;
    } while (g > 0 && group[0] === result[result.length - 1] && attempts < 20);
    result.push(...group);
  }
  levelTypeOrder = result;
}

function getLevelType(n) {
  if (!levelTypeOrder.length) shuffleLevelTypes();
  return levelTypeOrder[n] || 'words';
}

// Difficulty tiers by occurrence (1st/2nd/3rd time a math level appears)
const MATH_TIER_BY_OCC = [
  { add:'t1', sub:'t1', pat:'t1', shapes:'t1' }, // 1st math
  { add:'t2', sub:'t2', pat:'t2', shapes:'t2' }, // 2nd math
  { add:'t3', sub:'t3', pat:'t3', shapes:'t3' }, // 3rd math
];

function buildMathPool(occurrence) {
  const t = MATH_TIER_BY_OCC[Math.min(occurrence, 2)];
  // Pick from all 4 types: 3 addition, 2 subtraction, 3 patterns, 2 shapes
  // Shuffle the final pool so types are interleaved throughout the level
  return shuffleArray([
    ...shuffleArray(MATH.addition[t.add]).slice(0, 3),
    ...shuffleArray(MATH.subtraction[t.sub]).slice(0, 2),
    ...shuffleArray(MATH.patterns[t.pat]).slice(0, 3),
    ...shuffleArray(MATH.shapes[t.shapes]).slice(0, 2),
  ]);
}

function startLevel(n) {
  const lv = CHARACTERS[selectedChar].journey[n];
  wordCount = 0;
  streak = 0;

  const levelType = getLevelType(n);

  if (levelType === 'words') {
    // Pre-select words: 3 from Tier 1 (Q1–3), 2 from Tier 2 (Q4–5) — no repeats within level
    levelWordPool = [
      ...shuffleArray(WORDS_T1).slice(0, 3),
      ...shuffleArray(WORDS_T2).slice(0, 2)
    ];
    // Pre-select sentences — no repeats within the entire game session
    levelSentencePool = [
      ...pickUnusedSentences(SENTENCES_SIMPLE, usedSimpleIdxs, 3).sort((a,b) => a.words.length - b.words.length),
      ...pickUnusedSentences(SENTENCES_COMPLEX, usedComplexIdxs, 2).sort((a,b) => a.words.length - b.words.length)
    ];
    levelMathPool = [];
  } else if (levelType === 'spanish') {
    // Count which Spanish level this is (0=first, 1=second, 2=third)
    let spanishOccurrence = 0;
    for (let i = 0; i < n; i++) { if (getLevelType(i) === 'spanish') spanishOccurrence++; }

    if (spanishOccurrence === 0) {
      // ── Spanish Level 1: Picture vocab T1 (Q1-5) + Picture match (Q6-8) + Simple sentences (Q9-10) ──
      levelWordPool = shuffleArray([...PICTURE_VOCAB_T1]).slice(0, 5);
      levelPictureMatchPool = buildPictureMatchRounds(PICTURE_VOCAB_T1, 3);
      levelSentencePool = [
        ...pickUnusedSentences(SENTENCES_ES_SIMPLE, usedEsSimpleIdxs, 2).sort((a,b) => a.words.length - b.words.length)
      ];
    } else if (spanishOccurrence === 1) {
      // ── Spanish Level 2: Picture vocab T2 (Q1-5) + Picture match (Q6-8) + Simple sentences (Q9-10) ──
      levelWordPool = shuffleArray([...PICTURE_VOCAB_T2]).slice(0, 5);
      levelPictureMatchPool = buildPictureMatchRounds(PICTURE_VOCAB_T2, 3);
      levelSentencePool = [
        ...pickUnusedSentences(SENTENCES_ES_SIMPLE, usedEsSimpleIdxs, 2).sort((a,b) => a.words.length - b.words.length)
      ];
    } else {
      // ── Spanish Level 3: Audio words (Q1-3) + Picture match (Q4-6) + Simple (Q7-8) + Complex (Q9-10) ──
      levelWordPool = [
        ...shuffleArray(WORDS_ES_T1).slice(0, 2),
        ...shuffleArray(WORDS_ES_T2).slice(0, 1)
      ];
      levelPictureMatchPool = buildPictureMatchRounds([...PICTURE_VOCAB_T1, ...PICTURE_VOCAB_T2], 3);
      levelSentencePool = [
        ...pickUnusedSentences(SENTENCES_ES_SIMPLE,  usedEsSimpleIdxs,  2).sort((a,b) => a.words.length - b.words.length),
        ...pickUnusedSentences(SENTENCES_ES_COMPLEX, usedEsComplexIdxs, 2).sort((a,b) => a.words.length - b.words.length)
      ];
    }
    levelMathPool = [];
  } else {
    // Math level: count how many math levels came before this one for difficulty progression
    let mathOccurrence = 0;
    for (let i = 0; i < n; i++) { if (getLevelType(i) === 'math') mathOccurrence++; }
    levelMathPool     = buildMathPool(mathOccurrence);
    levelWordPool     = [];
    levelSentencePool = [];
  }

  applyBiomeBg(lv.emoji);
  document.getElementById('enc-location').textContent = `${lv.emoji} ${lv.name}`;
  document.getElementById('enc-problem').textContent  = `${lv.friend.emoji} ${lv.problem}`;
  updateScene(0);
  buildProgressBar();
  updateStarBadges();
  showScreen('encounter-screen');
  newRound();
}

  const lv = CHARACTERS[selectedChar].journey[currentLevel];
  document.getElementById('scene-display').textContent = lv.sceneStates[Math.min(count, 9)];
}

//  PICTURE MATCH HELPERS (Spanish Levels 1 & 2)
// ════════════════════════════════════════════════

// Build N rounds of 4-item picture matching from a vocab pool
function buildPictureMatchRounds(pool, count) {
  const shuffled = shuffleArray([...pool]);
  const rounds = [];
  for (let i = 0; i < count; i++) {
    const start = (i * 4) % shuffled.length;
    let items = [];
    for (let j = 0; j < 4; j++) items.push(shuffled[(start + j) % shuffled.length]);
    // Ensure no duplicates in a single round
    const seen = new Set();
    items = items.filter(it => { if (seen.has(it.spanish)) return false; seen.add(it.spanish); return true; });
    while (items.length < 4) {
      const extra = pool[Math.floor(Math.random() * pool.length)];
      if (!seen.has(extra.spanish)) { items.push(extra); seen.add(extra.spanish); }
    }
    rounds.push(items);
  }
  return rounds;
}

// Start a picture-match round: 4 emoji on left, 4 words on right, tap to match
function startPictureMatchRound(items) {
  picMatchState = { items, selected: null, matched: new Set() };
  const grid = document.getElementById('pic-match-grid');
  const pics = shuffleArray([...items]);
  const words = shuffleArray([...items]);
  grid.innerHTML = '';

  const colL = document.createElement('div'); colL.className = 'pic-match-col';
  const colR = document.createElement('div'); colR.className = 'pic-match-col';

  pics.forEach(item => {
    const card = document.createElement('div');
    card.className = 'pic-card emoji-card';
    card.textContent = item.emoji;
    card.dataset.spanish = item.spanish;
    card.onclick = () => picMatchTap(card, 'emoji');
    colL.appendChild(card);
  });

  words.forEach(item => {
    const card = document.createElement('div');
    card.className = 'pic-card word-card';
    card.textContent = item.spanish;
    card.dataset.spanish = item.spanish;
    card.onclick = () => picMatchTap(card, 'word');
    colR.appendChild(card);
  });

  grid.appendChild(colL);
  grid.appendChild(colR);
  speakSpanishWord(items[0].spanish);
}

function picMatchTap(card, type) {
  if (buttonsLocked) return;
  if (picMatchState.matched.has(card.dataset.spanish)) return;

  // If nothing selected yet, select this card
  if (!picMatchState.selected) {
    picMatchState.selected = card;
    card.classList.add('selected');
    speakSpanishWord(card.dataset.spanish);
    return;
  }

  // Second tap — check if it matches
  const first = picMatchState.selected;
  if (first === card) { first.classList.remove('selected'); picMatchState.selected = null; return; }

  if (first.dataset.spanish === card.dataset.spanish) {
    // Correct match!
    first.classList.remove('selected');
    first.classList.add('matched');
    card.classList.add('matched');
    picMatchState.matched.add(card.dataset.spanish);
    picMatchState.selected = null;
    // Show translation briefly
    const item = picMatchState.items.find(i => i.spanish === card.dataset.spanish);
    if (item) showTranslation(item.english);

    if (picMatchState.matched.size === picMatchState.items.length) {
      // All 4 matched — round complete
      buttonsLocked = true;
      setTimeout(() => {
        const done = onCorrectWord();
        if (!done) setTimeout(newRound, 500);
      }, 600);
    }
  } else {
    // Wrong match
    first.classList.add('wrong');
    card.classList.add('wrong');
    onWrongAnswer();
    setTimeout(() => {
      first.classList.remove('selected', 'wrong');
      card.classList.remove('wrong');
      picMatchState.selected = null;
    }, 600);
  }
}

// ════════════════════════════════════════════════
//  WORD GAME + SENTENCE BUILDER
// ════════════════════════════════════════════════
function newRound() {
  buttonsLocked = false;
  repeatCount = 0;
  hideTranslation();
  const wordBtns    = document.getElementById('word-buttons');
  const sentBldr    = document.getElementById('sentence-builder');
  const mathMode    = document.getElementById('math-mode');
  const instruction = document.getElementById('enc-instruction');

  // ── Math level ──
  if (getLevelType(currentLevel) === 'math') {
    wordBtns.style.display = 'none';
    sentBldr.style.display = 'none';
    mathMode.style.display = 'flex';
    currentWord     = '';
    currentSentence = null;
    currentMathQ    = levelMathPool[wordCount];
    startMathRound(currentMathQ);
    return;
  }

  mathMode.style.display = 'none';
  currentMathQ = null;
  const picMatch = document.getElementById('picture-match');
  picMatch.style.display = 'none';

  const isSpanish = getLevelType(currentLevel) === 'spanish';

  // Determine Spanish sub-level (0=first, 1=second, 2=third)
  let spanishOccurrence = 0;
  if (isSpanish) {
    for (let i = 0; i < currentLevel; i++) { if (getLevelType(i) === 'spanish') spanishOccurrence++; }
  }

  // ── Spanish Levels 1 & 2: Picture vocab (Q1-5) + Picture match (Q6-8) + Simple sentences (Q9-10) ──
  if (isSpanish && spanishOccurrence <= 1) {
    const vocabPool = spanishOccurrence === 0 ? PICTURE_VOCAB_T1 : PICTURE_VOCAB_T2;

    if (wordCount < 5) {
      // Q1-5: Picture vocab — show emoji, pick Spanish word
      sentBldr.style.display  = 'none';
      picMatch.style.display  = 'none';
      wordBtns.style.display  = 'flex';
      instruction.textContent = 'What is this in Spanish? 🇪🇸';

      const picItem = levelWordPool[wordCount];
      currentWord     = picItem.spanish;
      currentSentence = null;

      const pool = vocabPool.filter(p => p.spanish !== picItem.spanish);
      const distractors = shuffleArray(pool).slice(0, 2).map(p => p.spanish);
      const choices = shuffleArray([picItem.spanish, ...distractors]);

      choices.forEach((w, i) => {
        const btn = document.getElementById('btn-word-' + i);
        btn.textContent  = w;
        btn.className    = 'word-btn';
        btn.dataset.word = w;
      });

      document.getElementById('scene-display').textContent = picItem.emoji;
      document.getElementById('scene-display').style.fontSize = 'clamp(4rem, 15vw, 7rem)';
      setTimeout(() => speakSpanishWord(picItem.spanish), 400);

    } else if (wordCount < 8) {
      // Q6-8: Picture matching — 4 emoji ↔ 4 words
      wordBtns.style.display  = 'none';
      sentBldr.style.display  = 'none';
      picMatch.style.display  = 'flex';
      instruction.textContent = 'Match the picture to the word! 🎯';
      currentWord = '';
      currentSentence = null;

      document.getElementById('scene-display').style.fontSize = '';
      const matchIdx = wordCount - 5;
      startPictureMatchRound(levelPictureMatchPool[matchIdx]);

    } else {
      // Q9-10: Simple sentences
      wordBtns.style.display  = 'none';
      picMatch.style.display  = 'none';
      sentBldr.style.display  = 'flex';
      currentWord = '';

      document.getElementById('scene-display').style.fontSize = '';
      const sentIdx = wordCount - 8;
      instruction.textContent = '¡Ordena las palabras! 🎵';
      currentSentence = levelSentencePool[sentIdx];
      startSentenceRound(currentSentence);
    }
    return;
  }

  // ── Spanish Level 3: Audio words (Q1-3) + Picture match (Q4-6) + Simple (Q7-8) + Complex (Q9-10) ──
  if (isSpanish && spanishOccurrence === 2) {
    if (wordCount < 3) {
      // Q1-3: Audio words — hear word, pick from 3
      sentBldr.style.display  = 'none';
      picMatch.style.display  = 'none';
      wordBtns.style.display  = 'flex';
      instruction.textContent = 'Listen in Spanish! 🔊';

      const target = levelWordPool[wordCount];
      currentWord     = target;
      currentSentence = null;

      const pool = wordCount < 2 ? WORDS_ES_T1 : [...WORDS_ES_T1, ...WORDS_ES_T2];
      const distractors = shuffleArray(pool.filter(w => w !== target)).slice(0, 2);
      const choices = shuffleArray([target, ...distractors]);

      choices.forEach((w, i) => {
        const btn = document.getElementById('btn-word-' + i);
        btn.textContent  = w;
        btn.className    = 'word-btn';
        btn.dataset.word = w;
      });
      document.getElementById('scene-display').style.fontSize = '';
      setTimeout(() => speakSpanishWord(currentWord), 400);

    } else if (wordCount < 6) {
      // Q4-6: Picture matching — mixed T1+T2
      wordBtns.style.display  = 'none';
      sentBldr.style.display  = 'none';
      picMatch.style.display  = 'flex';
      instruction.textContent = 'Match the picture to the word! 🎯';
      currentWord = '';
      currentSentence = null;

      const matchIdx = wordCount - 3;
      startPictureMatchRound(levelPictureMatchPool[matchIdx]);

    } else if (wordCount < 8) {
      // Q7-8: Simple sentences
      wordBtns.style.display  = 'none';
      picMatch.style.display  = 'none';
      sentBldr.style.display  = 'flex';
      currentWord = '';

      const sentIdx = wordCount - 6;
      instruction.textContent = '¡Ordena las palabras! 🎵';
      currentSentence = levelSentencePool[sentIdx];
      startSentenceRound(currentSentence);

    } else {
      // Q9-10: Complex sentences
      wordBtns.style.display  = 'none';
      picMatch.style.display  = 'none';
      sentBldr.style.display  = 'flex';
      currentWord = '';

      const sentIdx = wordCount - 6; // indices 2,3 in the pool (simple=0,1 complex=2,3)
      instruction.textContent = '¡Construye la oración! 🧩';
      currentSentence = levelSentencePool[sentIdx];
      startSentenceRound(currentSentence);
    }
    return;
  }

  // ── Standard English word/sentence flow ──
  if (wordCount < 5) {
    // ── Word mode: Q1–5 (English) ──
    sentBldr.style.display  = 'none';
    wordBtns.style.display  = 'flex';
    instruction.textContent = 'Listen and find the word! 🔊';

    const target = levelWordPool[wordCount];
    currentWord     = target;
    currentSentence = null;

    const pool = wordCount < 3 ? WORDS_T1 : [...WORDS_T1, ...WORDS_T2];
    const forbidden   = homophonesOf(target);
    const distractors = shuffleArray(pool.filter(w => w !== target && !forbidden.includes(w))).slice(0, 2);
    const choices     = shuffleArray([target, ...distractors]);

    choices.forEach((w, i) => {
      const btn = document.getElementById('btn-word-' + i);
      btn.textContent  = w;
      btn.className    = 'word-btn';
      btn.dataset.word = w;
    });
    document.getElementById('scene-display').style.fontSize = '';
    setTimeout(() => speakInCurrentLang(currentWord, true), 400);

  } else {
    // ── Sentence mode: Q6–10 (English) ──
    wordBtns.style.display  = 'none';
    sentBldr.style.display  = 'flex';
    currentWord = '';

    const sentIdx = wordCount - 5;
    instruction.textContent = sentIdx < 3
      ? 'Tap the words in order! 🎵'
      : 'Build the whole sentence! 🧩';

    currentSentence = levelSentencePool[sentIdx];
    startSentenceRound(currentSentence);
  }
}

function checkAnswer(btn) {
  if (buttonsLocked) return;
  if (btn.dataset.word === currentWord) {
    buttonsLocked = true;
    btn.classList.add('correct');
    if (getLevelType(currentLevel) === 'spanish') {
      // Check picture vocab pools first, then ES_TRANSLATIONS
      const picItem = [...PICTURE_VOCAB_T1, ...PICTURE_VOCAB_T2].find(p => p.spanish === currentWord);
      const t = picItem ? picItem.english : ES_TRANSLATIONS[currentWord];
      if (t) showTranslation(t);
    }
    const done = onCorrectWord();
    if (!done) setTimeout(newRound, 1000);
  } else {
    btn.classList.add('wrong');
    onWrongAnswer();
    speakInCurrentLang(currentWord, true);
    setTimeout(() => btn.classList.remove('wrong'), 600);
  }
}

// ── Sentence Builder ──
function startSentenceRound(sent) {
  bankTileOrder  = shuffleArray([...sent.words, ...sent.decoys]);
  sentencePlaced = new Array(sent.words.length).fill(-1);
  renderSentenceUI();
  setTimeout(() => speakInCurrentLang(sent.words.join(' '), false), 400);
}

function renderSentenceUI() {
  // Slots
  const slotsEl = document.getElementById('sentence-slots');
  slotsEl.innerHTML = '';
  sentencePlaced.forEach((tileIdx, slotIdx) => {
    const div = document.createElement('div');
    div.className   = 'sent-slot' + (tileIdx >= 0 ? ' filled' : '');
    div.textContent = tileIdx >= 0 ? bankTileOrder[tileIdx] : '';
    if (tileIdx >= 0) div.onclick = () => unplaceWord(slotIdx);
    slotsEl.appendChild(div);
  });
  // Bank
  const bankEl = document.getElementById('sentence-word-bank');
  bankEl.innerHTML = '';
  const usedTiles = new Set(sentencePlaced.filter(t => t >= 0));
  bankTileOrder.forEach((word, tileIdx) => {
    const div = document.createElement('div');
    div.className   = 'word-tile' + (usedTiles.has(tileIdx) ? ' used' : '');
    div.textContent = word;
    if (!usedTiles.has(tileIdx)) div.onclick = () => placeWord(tileIdx);
    bankEl.appendChild(div);
  });
}

function placeWord(tileIdx) {
  if (buttonsLocked) return;
  const emptySlot = sentencePlaced.indexOf(-1);
  if (emptySlot < 0) return;
  sentencePlaced[emptySlot] = tileIdx;
  renderSentenceUI();
  if (!sentencePlaced.includes(-1)) checkSentence();
}

function unplaceWord(slotIdx) {
  if (buttonsLocked) return;
  sentencePlaced[slotIdx] = -1;
  renderSentenceUI();
}

function checkSentence() {
  buttonsLocked = true;
  const placed  = sentencePlaced.map(t => bankTileOrder[t]);
  const correct = placed.join(' ') === currentSentence.words.join(' ');
  const slots   = document.querySelectorAll('.sent-slot');
  if (correct) {
    slots.forEach(s => s.classList.add('correct'));
    if (getLevelType(currentLevel) === 'spanish' && currentSentence.translation) {
      showTranslation(currentSentence.translation);
    }
    setTimeout(() => {
      const done = onCorrectWord();
      if (!done) setTimeout(newRound, 600);
    }, 800);
  } else {
    slots.forEach(s => s.classList.add('wrong'));
    onWrongAnswer();
    setTimeout(() => {
      sentencePlaced = new Array(currentSentence.words.length).fill(-1);
      buttonsLocked  = false;
      speakInCurrentLang(currentSentence.words.join(' '), false);
      renderSentenceUI();
    }, 900);
  }
}

function speakSentence(text, rate) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || 0.75; u.pitch = 1.0; u.lang = 'en-US';
  if (_englishVoice) u.voice = _englishVoice;
  window.speechSynthesis.speak(u);
}

// Pick specific voices once they are available
let _englishVoice = null;   // Mark
let _spanishVoiceM = null;  // Raul  (words)
let _spanishVoiceF = null;  // Sabina (sentences)

function _loadVoices() {
  const voices = window.speechSynthesis.getVoices();

  // English – prefer Microsoft Mark
  _englishVoice =
    voices.find(v => v.name.toLowerCase().includes('mark')) ||
    voices.find(v => v.lang === 'en-US') ||
    null;

  // Spanish male – prefer Microsoft Raul
  _spanishVoiceM =
    voices.find(v => v.name.toLowerCase().includes('raul')) ||
    voices.find(v => v.lang === 'es-MX') ||
    voices.find(v => v.lang === 'es-US') ||
    voices.find(v => v.lang.startsWith('es-')) ||
    null;

  // Spanish female – prefer Microsoft Sabina, fall back to Raul
  _spanishVoiceF =
    voices.find(v => v.name.toLowerCase().includes('sabina')) ||
    _spanishVoiceM;
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = _loadVoices;
  _loadVoices();
}

// iOS Safari + iOS PWAs require speechSynthesis.speak() to be initiated from a real
// user gesture, OR to be "warmed up" with a silent utterance inside one. Without this,
// the first speak() call after page load gets silently dropped on mobile — so Marcelle
// taps "play" and hears nothing. Fires a silent utterance once on the first user input.
let _speechUnlocked = false;
function unlockSpeechOnce() {
  if (_speechUnlocked || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance('.');
    u.volume = 0; u.rate = 1; u.pitch = 1;
    window.speechSynthesis.speak(u);
    _speechUnlocked = true;
    // Voices often populate AFTER the first speak() on iOS — re-read them now.
    setTimeout(_loadVoices, 100);
  } catch(e) {}
}
['touchstart','touchend','click','keydown'].forEach(evt => {
  document.addEventListener(evt, unlockSpeechOnce, { once: false, passive: true });
});

function speakSpanishWord(text, rate) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || 0.8; u.pitch = 1.1; u.lang = 'es-MX';
  if (_spanishVoiceM) u.voice = _spanishVoiceM;
  window.speechSynthesis.speak(u);
}

function speakSpanishSentence(text, rate) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || 0.75; u.pitch = 1.0; u.lang = 'es-MX';
  if (_spanishVoiceF) u.voice = _spanishVoiceF;
  window.speechSynthesis.speak(u);
}

function showTranslation(text) {
  const el = document.getElementById('translation-hint');
  el.textContent  = '✨ ' + text;
  el.style.display = 'block';
}
function hideTranslation() {
  document.getElementById('translation-hint').style.display = 'none';
}

// Route TTS to the right language based on the active level
function speakInCurrentLang(text, isWord, rate) {
  const spanish = getLevelType(currentLevel) === 'spanish';
  if (spanish) { isWord ? speakSpanishWord(text, rate) : speakSpanishSentence(text, rate); }
  else         { isWord ? speakWord(text, rate)         : speakSentence(text, rate); }
}

function repeatCurrentPrompt() {
  repeatCount++;
  // Each press slows down by 15% — 0.75 → 0.64 → 0.54 → 0.46 (floor 0.35)
  const rate = Math.max(0.35, 0.75 * Math.pow(0.85, repeatCount));
  if (currentMathQ)         { speakSentence(currentMathQ.text, rate); }
  else if (currentSentence) { speakInCurrentLang(currentSentence.words.join(' '), false, rate); }
  else                      { speakInCurrentLang(currentWord, true, rate); }
}

function startMathRound(q) {
  const display     = document.getElementById('math-display');

function checkMathAnswer(chosen) {
  if (buttonsLocked) return;
  const correct = String(chosen).trim() === String(currentMathQ.answer).trim();
  if (correct) {
    buttonsLocked = true;
    document.querySelectorAll('.math-btn').forEach(b => {
      if (String(b.textContent).trim() === String(currentMathQ.answer).trim())
        b.classList.add('correct');
    });
    const done = onCorrectWord();
    if (!done) setTimeout(newRound, 1000);
  } else {
    document.querySelectorAll('.math-btn').forEach(b => {
      if (String(b.textContent).trim() === String(chosen).trim())
        b.classList.add('wrong');
    });

    speakSentence(currentMathQ.text);
    setTimeout(() => {
      document.querySelectorAll('.math-btn').forEach(b => b.classList.remove('wrong'));
    }, 600);
  }
}

function buildClockSVG(hours, minutes) {
  const cx = 90, cy = 90, r = 80;
  const toRad = d => d * Math.PI / 180;
  const hAngle = ((hours % 12) + minutes / 60) * 30 - 90;
  const mAngle = minutes * 6 - 90;
  const hx = (cx + 45 * Math.cos(toRad(hAngle))).toFixed(1);
  const hy = (cy + 45 * Math.sin(toRad(hAngle))).toFixed(1);
  const mx = (cx + 65 * Math.cos(toRad(mAngle))).toFixed(1);
  const my = (cy + 65 * Math.sin(toRad(mAngle))).toFixed(1);

  // Hour numbers
  let nums = '';
  for (let i = 1; i <= 12; i++) {
    const a  = toRad(i * 30 - 90);
    const tx = (cx + 63 * Math.cos(a)).toFixed(1);
    const ty = (cy + 63 * Math.sin(a)).toFixed(1);
    nums += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="Nunito,sans-serif" font-weight="bold" fill="#3a2860">${i}</text>`;
  }
  // Tick marks
  let ticks = '';
  for (let i = 0; i < 60; i++) {
    const a  = toRad(i * 6 - 90);
    const isMajor = i % 5 === 0;
    const inner = r - (isMajor ? 8 : 4);
    const x1 = (cx + r     * Math.cos(a)).toFixed(1);
    const y1 = (cy + r     * Math.sin(a)).toFixed(1);
    const x2 = (cx + inner * Math.cos(a)).toFixed(1);
    const y2 = (cy + inner * Math.sin(a)).toFixed(1);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c0a0e0" stroke-width="${isMajor ? 2 : 1}"/>`;
  }

  return `<svg width="180" height="180" viewBox="0 0 180 180">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="white" stroke="#a080e0" stroke-width="4"/>
    ${ticks}${nums}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#3a2860" stroke-width="6" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#7755cc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#3a2860"/>
  </svg>`;
}

function onCorrectWord() {
  streak++;
  totalStars++;

  // Streak bonus: every 3 in a row = +1 bonus star + fanfare
  if (streak > 0 && streak % 3 === 0) {
    totalStars++;
    playSound('streak');
    fireConfetti(22, ['⭐','🌟','✨','💫','🎉','🔥']);
    flashScreen('green');
    showStreakBanner(streak);
    // Fireworks at 5+ streak
    if (streak >= 5) fireFireworks();
  } else {
    playSound('correct');
    fireConfetti(8, ['⭐','✨','🌟']);
    flashScreen('green');
  }

  fillDot(wordCount);
  wordCount++;
  updateScene(wordCount);
  updateStarBadges();
  saveProgress();
  if (wordCount >= 10) {
    playSound('levelwin');
    fireFireworks();
    setTimeout(levelComplete, 1100);
    return true;
  }
  return false;
}

// ── Audio (Web Audio API — no external files) ──
let _audioCtx = null;
let _audioUnlocked = false;
function getAudioCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// iOS Safari + mobile Chrome require AudioContext to be created/resumed inside a real
// user-gesture handler. Without this, sounds appear to play but produce no audio because
// the context stays in 'suspended' state forever.
function unlockAudioOnce() {
  if (_audioUnlocked) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  // Resume + play a silent buffer to fully unlock
  const resumePromise = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
  resumePromise.then(() => {
    try {
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
      _audioUnlocked = true;
    } catch(e) {}
  });
}
['touchstart','touchend','click','keydown'].forEach(evt => {
  document.addEventListener(evt, unlockAudioOnce, { once: false, passive: true });
});

function playTone(ctx, freq, startTime, dur, vol, type) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.01, startTime + dur);
  osc.start(startTime); osc.stop(startTime + dur);
}

function playSound(type) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  if (type === 'correct') {
    playTone(ctx, 523, t, 0.12, 0.22, 'sine');       // C5
    playTone(ctx, 659, t+0.1, 0.14, 0.22, 'sine');   // E5
  } else if (type === 'wrong') {
    playTone(ctx, 196, t, 0.25, 0.12, 'triangle');   // G3 buzz
  } else if (type === 'streak') {
    playTone(ctx, 523, t, 0.1, 0.25, 'sine');        // C5
    playTone(ctx, 659, t+0.1, 0.1, 0.25, 'sine');    // E5
    playTone(ctx, 784, t+0.2, 0.12, 0.25, 'sine');   // G5
    playTone(ctx, 1047, t+0.32, 0.2, 0.28, 'sine');  // C6
  } else if (type === 'levelwin') {
    playTone(ctx, 523, t, 0.15, 0.25, 'sine');
    playTone(ctx, 659, t+0.15, 0.15, 0.25, 'sine');
    playTone(ctx, 784, t+0.3, 0.15, 0.25, 'sine');
    playTone(ctx, 1047, t+0.45, 0.35, 0.28, 'sine');
  }
}

// ── Confetti (DOM-based emoji particles) ──
function fireConfetti(count, emojis) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.4;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:100;`;
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 150;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 70;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(0.3)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${Math.random()*720-360}deg)`, opacity: 0 }
    ], { duration: 700 + Math.random()*400, easing: 'cubic-bezier(0,.8,.2,1)' });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

// ── Fireworks (shoot from left and right sides) ──
function fireFireworks() {
  const W = window.innerWidth, H = window.innerHeight;
  const EMOJIS = ['🎆','🎇','✨','💫','⭐','🌟','🔥','🎉'];
  const COLORS = ['#ff4444','#ffaa00','#44ff44','#4488ff','#ff44ff','#ffff44','#ff8800','#44ffff'];

  // Launch from both sides, 3 bursts each with staggered timing
  [0, 300, 600].forEach((delay, burst) => {
    setTimeout(() => {
      // Left side burst
      const lx = W * 0.08, ly = H * (0.3 + Math.random() * 0.25);
      spawnBurst(lx, ly);
      // Right side burst
      const rx = W * 0.92, ry = H * (0.3 + Math.random() * 0.25);
      spawnBurst(rx, ry);
    }, delay);
  });

  function spawnBurst(cx, cy) {
    // Rising trail
    const trail = document.createElement('span');
    trail.textContent = '🎇';
    trail.style.cssText = `position:fixed;left:${cx}px;bottom:-20px;font-size:24px;pointer-events:none;z-index:100;`;
    trail.animate([
      { transform: 'translateX(-50%)', opacity: 1 },
      { transform: `translateX(-50%) translateY(-${window.innerHeight - cy}px)`, opacity: 0.6 }
    ], { duration: 400, easing: 'ease-out' });
    document.body.appendChild(trail);
    setTimeout(() => trail.remove(), 400);

    // Explosion after trail
    setTimeout(() => {
      for (let i = 0; i < 14; i++) {
        const el = document.createElement('span');
        const isEmoji = Math.random() > 0.4;
        if (isEmoji) {
          el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
          el.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${14+Math.random()*20}px;pointer-events:none;z-index:100;`;
        } else {
          el.textContent = '●';
          el.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${10+Math.random()*14}px;pointer-events:none;z-index:100;color:${COLORS[Math.floor(Math.random()*COLORS.length)]};`;
        }
        const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
        const dist = 60 + Math.random() * 140;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        el.animate([
          { transform: 'translate(-50%,-50%) scale(0.2)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(calc(-50% + ${dx*1.2}px), calc(-50% + ${dy*1.2 + 40}px)) scale(0.5)`, opacity: 0 }
        ], { duration: 900 + Math.random()*400, easing: 'ease-out' });
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
      }
    }, 350);
  }
}
